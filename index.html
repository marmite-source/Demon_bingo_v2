<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironman CC Demon Bingo</title>
<style>
:root{
  --bg:#0d0f12;--panel:#181b20;--card:#23272e;--text:#f5f6f7;--muted:#adb4bf;--border:#3b424d;
  --locked:#a52a2a;--unlocked:#dc7a0b;--complete:#2b9a50;--selected:#d9b65b;--board:#d9e6ec;--line:#7f1d22;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.app{max-width:1900px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:clamp(28px,4vw,48px)}.subtitle{color:var(--muted);margin-top:6px}.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.team{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;min-width:0}.team-head{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.team-title{font-size:22px;font-weight:900}.captains{font-size:13px;color:var(--muted);margin-top:3px}.editbar{display:flex;gap:8px;align-items:center}.badge{border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted)}
.btn{background:#15181d;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#767d89}
.board-shell{margin-top:10px;border-radius:14px;overflow:hidden;background:#121418}.board-shell svg{display:block;width:100%;height:auto}
.seal-ring{fill:none;stroke:#575d66;stroke-width:10}.seal-inner{fill:var(--board);stroke:var(--line);stroke-width:5}.seal-line{stroke:var(--line);stroke-width:5;stroke-linecap:round;opacity:.92}.seal-line.minor{stroke-width:3;opacity:.68}
.node,.trial,.finalseal{cursor:pointer;outline:none}.node circle{stroke-width:5}.node text{fill:#111;font-weight:900;font-size:16px;pointer-events:none}.trial rect{stroke-width:4;rx:9}.trial text{fill:#111;font-weight:900;font-size:10px;text-anchor:middle;pointer-events:none}
.locked circle,.locked rect{fill:#f3cccc;stroke:var(--locked)}.unlocked circle,.unlocked rect{fill:#ffe0ae;stroke:var(--unlocked)}.completed circle,.completed rect{fill:#c8efd3;stroke:var(--complete)}
.selected circle,.selected rect{stroke:var(--selected)!important;stroke-width:7!important}.finalseal polygon{stroke-width:6}.finalseal text{pointer-events:none;text-anchor:middle;font-weight:900;fill:#111}
.finalseal.locked polygon{fill:#efcaca;stroke:var(--locked)}.finalseal.unlocked polygon{fill:#ffe0ae;stroke:var(--unlocked)}.finalseal.completed polygon{fill:#c8efd3;stroke:var(--complete)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.status-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:5px 8px}
.inspector{margin-top:16px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.inspector-head{display:flex;justify-content:space-between;gap:14px;align-items:start;flex-wrap:wrap}
.kicker{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:12px;font-weight:800}.inspect-title{font-size:26px;font-weight:900;margin-top:3px}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}.section.done{border-color:var(--complete)}
.section h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 9px}.section h3 b{color:var(--text)}
.branch{border-left:3px solid #434a55;padding-left:10px;margin:8px 0}.branch-title{font-size:13px;font-weight:800;margin-bottom:5px}.branch-status{font-size:11px;color:var(--muted);margin-left:6px}
.leaf{padding:9px 0;border-top:1px solid #363b44}.leaf:first-child{border-top:none}.leaf-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.leaf-label{font-size:14px;line-height:1.35}.leaf-check{display:flex;align-items:center;gap:7px}.leaf-check input{width:19px;height:19px}
.qty{display:flex;align-items:center;gap:6px}.qty input{width:90px;background:#121418;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px}.target{font-size:12px;color:var(--muted);white-space:nowrap}
.note-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:7px}.note-row input{width:100%;background:#15181d;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font-size:14px}.save{padding:7px 9px;font-size:12px}
.readonly{opacity:.72}.progressbar{height:7px;background:#121418;border-radius:999px;overflow:hidden;margin-top:8px}.progressbar>span{display:block;height:100%;background:var(--complete)}
.msg{font-size:13px;color:var(--muted)}.trial-grid,.final-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.objective,.final-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}.objective.done,.final-card.done{border-color:var(--complete)}
.objective h3,.final-card h3{margin:0 0 6px;font-size:16px}.summary{font-size:12px;color:var(--muted);margin-bottom:6px}.win-banner{margin-top:14px;border:1px solid var(--complete);background:#163120;padding:14px;border-radius:12px;font-weight:900;font-size:20px;text-align:center}
.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modalback.open{display:flex}.modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}.modal h2{margin:0 0 10px}.modal input{width:100%;background:#111318;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(max-width:1150px){.team-grid{grid-template-columns:1fr}.sections{grid-template-columns:1fr}.trial-grid,.final-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Ironman CC — Demon Bingo</h1><div class="subtitle">Live head-to-head tracker with per-player notes and detailed sub-objectives.</div></div>
    <button id="refresh" class="btn">Refresh progress</button>
  </div>
  <div class="team-grid" id="team-grid"></div>
  <section class="inspector">
    <div class="inspector-head">
      <div><div class="kicker" id="inspect-kicker">Select an item</div><div class="inspect-title" id="inspect-title">Click a node or Trial on either board</div></div>
      <div class="msg" id="inspect-status"></div>
    </div>
    <div id="inspect-body"></div>
  </section>
</div>

<div class="modalback" id="modalback">
  <div class="modal">
    <h2 id="modal-title">Unlock editing</h2>
    <div class="msg">Enter this team's passcode.</div>
    <input id="passcode" type="password" autocomplete="off" placeholder="Team passcode">
    <div class="msg" id="pass-msg" style="margin-top:8px"></div>
    <div class="modal-actions"><button class="btn" id="cancel-pass">Cancel</button><button class="btn" id="save-pass">Unlock</button></div>
  </div>
</div>

const finalChallenges={
 weaponry:{name:'Weaponry',rule:'Any 13; each one may be used only once.',need:13,items:['Zammy Hilt','Staff of the Dead','Zammy Spear','Steam Battlestaff','Ancient Hilt','Zaryte Crossbow (Nihil Horn + ACB)','Eye of Ayak','Tormented Synapse','Burning Claws (2)','Abyssal Whip','Abyssal Dagger','Abyssal Bludgeon (3 parts, not unique)','Infernal Tool','Four SRA Pieces','Granite Hammer (not Maul)','Smoke Battlestaff','Elder Maul','Twisted Bow','Dragon Claws','Kodai Insignia + Master Wand',"Dinh's Bulwark",'Dragon Hunter Crossbow','Scythe of Vitur','Ghazri Rapier','Sanguinesti Staff']},
 timbs:{name:'The Timbs',rule:'Avernic Treads and any 4 of 6 upgrades.',special:'timbs',items:['Avernic Treads','Dragon Boots','Ranger Boots','Infinity Boots','Primordial Crystal','Pegasian Crystal','Eternal Crystal']},
 armory:{name:'Armory',rule:'Complete the full required protection set.',special:'all',items:['Helm / Chest / Legs','Cape','Neck','Gloves','Blessing']},
 shards:{name:'Shards',rule:'Get all 9 shards.',special:'all',items:['Oathplate Shards','Nihil Shards','Ecumenical Key Shards','Ancient Shard','Zenyte Shard','Zalcano Shard','Godsword Shard 1','Godsword Shard 2','Godsword Shard 3']},
 servant:{name:'Servant',rule:'Any featured boss pet.',need:1,items:['Abyssal Orphan','Hellpuppy','Dom','Yami','Baron','Nexling',"K'ril",'Thermy','Skotos','Dusk','Olmlet','Lil Zik',"Vet'ion Jr."]},
 completionist:{name:'Completionist',rule:'Fully Level 13/25 Nodes and Master 6/10 Trials.',special:'completionist',items:[]}
};

const pos={'1':[350,70],'2':[95,260],'3':[180,565],'4':[520,565],'5':[605,260],'A':[215,120],'B':[320,175],'C':[380,175],'D':[485,120],'E':[180,260],'F':[150,320],'G':[95,405],'H':[210,475],'I':[255,535],'J':[350,625],'K':[445,535],'L':[490,475],'M':[605,405],'N':[550,320],'O':[520,260],'P':[285,320],'Q':[305,405],'R':[395,405],'S':[415,320],'T':[350,260]};
const starting=new Set(['1','2','3','4','5']); const prereq={};Object.entries(nodes).forEach(([id,n])=>n.unlocks.forEach(x=>{if(nodes[x])(prereq[x]??=[]).push(id)}));
const centroid=ids=>{const p=ids.map(i=>pos[i]);return[p.reduce((a,x)=>a+x[0],0)/p.length,p.reduce((a,x)=>a+x[1],0)/p.length]};const trialPos={};Object.entries(trials).forEach(([id,t])=>trialPos[id]=centroid(t.nodes));

let state={},codes={},selection=null,modalTeam=null;
const sk=(team,type,id,req)=>`${team}|${type}|${id}|${req}`;
const rec=(team,type,id,req)=>state[sk(team,type,id,req)]||{completed:false,progress_value:0,notes:''};
function leafDone(team,type,id,leaf){const r=rec(team,type,id,leaf.key);return leaf.kind==='check'?!!r.completed:(r.progress_value||0)>=(leaf.target||0)}
function sumLeaves(team,type,id,tree){if(tree.kind==='qty')return rec(team,type,id,tree.key).progress_value||0;if(tree.kind==='check')return rec(team,type,id,tree.key).completed?1:0;return tree.children.reduce((a,c)=>a+sumLeaves(team,type,id,c),0)}
function treeDone(team,type,id,tree){
 if(tree.kind==='check'||tree.kind==='qty')return leafDone(team,type,id,tree);
 if(tree.mode==='all')return tree.children.every(c=>treeDone(team,type,id,c));
 if(tree.mode==='any')return tree.children.some(c=>treeDone(team,type,id,c));
 if(tree.mode==='sum')return sumLeaves(team,type,id,tree)>=tree.need;
 return false;
}
function nodeSectionDone(team,id,i){return treeDone(team,'node',id,nodes[id].sections[i].tree)}
function nodeDone(team,id){return nodeSectionDone(team,id,0)}
function nodeFull(team,id){return nodes[id].sections.every((_,i)=>nodeSectionDone(team,id,i))}
function nodeUnlocked(team,id){return starting.has(id)||(prereq[id]||[]).some(p=>nodeDone(team,p))}
function objectiveDone(team,id,i){return treeDone(team,'trial',id,trials[id].objectives[i])}
function trialCount(team,id){return trials[id].objectives.filter((_,i)=>objectiveDone(team,id,i)).length}
function trialUnlocked(team,id){return trials[id].nodes.every(n=>nodeDone(team,n))}
function trialDone(team,id){return trialCount(team,id)>=3}
function trialMastered(team,id){return trialCount(team,id)===5}
function finalUnlocked(team){return ['P','Q','R','S','T'].every(n=>nodeDone(team,n))&&Object.keys(trials).filter(t=>trialDone(team,t)).length>=5}
function finalLeafDone(team,ch,i){return rec(team,'final_seal',ch.name,String(i)).completed}
function finalChallengeDone(team,slug){
 const ch=finalChallenges[slug];
 if(ch.special==='timbs')return finalLeafDone(team,ch,0)&&[1,2,3,4,5,6].filter(i=>finalLeafDone(team,ch,i)).length>=4;
 if(ch.special==='all')return ch.items.every((_,i)=>finalLeafDone(team,ch,i));
 if(ch.special==='completionist')return Object.keys(nodes).filter(n=>nodeFull(team,n)).length>=13&&Object.keys(trials).filter(t=>trialMastered(team,t)).length>=6;
 return ch.items.filter((_,i)=>finalLeafDone(team,ch,i)).length>=ch.need;
}
function finalChallengeCount(team){return Object.keys(finalChallenges).filter(s=>finalChallengeDone(team,s)).length}
function finalDone(team){return finalUnlocked(team)&&finalChallengeCount(team)>=3}
function nodeStatus(team,id){return nodeDone(team,id)?'completed':nodeUnlocked(team,id)?'unlocked':'locked'}
function trialStatus(team,id){return trialDone(team,id)?'completed':trialUnlocked(team,id)?'unlocked':'locked'}
function finalStatus(team){return finalDone(team)?'completed':finalUnlocked(team)?'unlocked':'locked'}

function boardSvg(team){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 700 700');
 svg.innerHTML=`<circle cx="350" cy="350" r="310" class="seal-ring"/><circle cx="350" cy="350" r="292" class="seal-inner"/>
 <line x1="350" y1="70" x2="180" y2="565" class="seal-line"/><line x1="350" y1="70" x2="520" y2="565" class="seal-line"/><line x1="95" y1="260" x2="605" y2="260" class="seal-line"/>
 <line x1="95" y1="260" x2="520" y2="565" class="seal-line"/><line x1="605" y1="260" x2="180" y2="565" class="seal-line"/><line x1="180" y1="565" x2="605" y2="260" class="seal-line minor"/><line x1="520" y1="565" x2="95" y2="260" class="seal-line minor"/>`;
 Object.entries(trialPos).forEach(([id,[x,y]])=>{const g=document.createElementNS(svg.namespaceURI,'g');g.setAttribute('class',`trial ${trialStatus(team,id)} ${selection?.team===team&&selection.type==='trial'&&selection.id===id?'selected':''}`);g.setAttribute('transform',`translate(${x} ${y})`);const lab=trials[id].name,w=Math.max(64,Math.min(112,44+lab.length*5));g.innerHTML=`<rect x="${-w/2}" y="-16" width="${w}" height="32"/><text y="4">${lab}</text>`;g.onclick=()=>select(team,'trial',id);svg.appendChild(g)});
 Object.entries(pos).forEach(([id,[x,y]])=>{const g=document.createElementNS(svg.namespaceURI,'g');g.setAttribute('class',`node ${nodeStatus(team,id)} ${selection?.team===team&&selection.type==='node'&&selection.id===id?'selected':''}`);g.setAttribute('transform',`translate(${x} ${y})`);g.innerHTML=`<circle r="${starting.has(id)?24:21}"/><text text-anchor="middle" dominant-baseline="central">${id}</text>`;g.onclick=()=>select(team,'node',id);svg.appendChild(g)});
 const fg=document.createElementNS(svg.namespaceURI,'g');fg.setAttribute('class',`finalseal ${finalStatus(team)} ${selection?.team===team&&selection.type==='final_seal'?'selected':''}`);fg.innerHTML=`<polygon points="350,305 390,334 375,380 325,380 310,334"/><text x="350" y="344">FINAL</text><text x="350" y="362" font-size="10">SEAL</text>`;fg.onclick=()=>select(team,'final_seal','final');svg.appendChild(fg);return svg;
}
function renderTeams(){
 const grid=document.getElementById('team-grid');grid.innerHTML='';
 TEAMS.forEach(t=>{const card=document.createElement('section');card.className='team';const cn=Object.keys(nodes).filter(n=>nodeDone(t.slug,n)).length,ct=Object.keys(trials).filter(n=>trialDone(t.slug,n)).length;
 card.innerHTML=`<div class="team-head"><div><div class="team-title">${t.name}</div><div class="captains">${t.captains}</div></div><div class="editbar"><span class="badge">${codes[t.slug]?'EDIT MODE':'READ ONLY'}</span><button class="btn editbtn">${codes[t.slug]?'Lock editing':'Unlock editing'}</button></div></div><div class="status-summary"><span class="stat">${cn}/25 nodes</span><span class="stat">${ct}/10 Trials</span><span class="stat">Final Seal: ${finalStatus(t.slug).toUpperCase()}</span></div><div class="board-shell"></div><div class="legend"><span><i style="background:var(--locked)"></i>Locked</span><span><i style="background:var(--unlocked)"></i>Unlocked</span><span><i style="background:var(--complete)"></i>Completed</span></div>`;
 card.querySelector('.board-shell').appendChild(boardSvg(t.slug));card.querySelector('.editbtn').onclick=()=>codes[t.slug]?(delete codes[t.slug],renderTeams(),renderInspector()):openPass(t.slug);grid.appendChild(card)});
}
function select(team,type,id){selection={team,type,id};renderTeams();renderInspector()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderLeaf(team,type,id,leaf){
 const r=rec(team,type,id,leaf.key),editable=!!codes[team],done=leafDone(team,type,id,leaf);
 let ctl=leaf.kind==='check'?`<div class="leaf-check"><input class="leaf-check-input" type="checkbox" data-team="${team}" data-type="${type}" data-id="${id}" data-key="${leaf.key}" ${r.completed?'checked':''} ${editable?'':'disabled'}><span>${done?'✓':''}</span></div>`:`<div class="qty"><input class="leaf-qty-input" type="number" min="0" step="1" value="${r.progress_value||0}" data-team="${team}" data-type="${type}" data-id="${id}" data-key="${leaf.key}" ${editable?'':'disabled'}><span class="target">${leaf.target>0?'/ '+leaf.target:''}</span></div>`;
 return `<div class="leaf ${editable?'':'readonly'}"><div class="leaf-main"><div class="leaf-label">${esc(leaf.label)}</div>${ctl}</div><div class="note-row"><input class="leaf-note" value="${esc(r.notes||'')}" placeholder="Completed by / notes" data-team="${team}" data-type="${type}" data-id="${id}" data-key="${leaf.key}" ${editable?'':'disabled'}><button class="btn save leaf-save" data-team="${team}" data-type="${type}" data-id="${id}" data-key="${leaf.key}" ${editable?'':'disabled'}>Save</button></div></div>`;
}
function renderTree(team,type,id,tree,depth=0){
 if(tree.kind==='check'||tree.kind==='qty')return renderLeaf(team,type,id,tree);
 const done=treeDone(team,type,id,tree);
 const extra=tree.mode==='sum'?` — ${sumLeaves(team,type,id,tree)}/${tree.need}`:done?' — complete':'';
 return `<div class="branch"><div class="branch-title">${esc(tree.label|| (tree.mode==='all'?'Complete all':tree.mode==='any'?'Complete any':'Combined total'))}<span class="branch-status">${extra}</span></div>${tree.children.map(c=>renderTree(team,type,id,c,depth+1)).join('')}</div>`;
}
function bindEditors(scope){
 scope.querySelectorAll('.leaf-check-input').forEach(el=>el.addEventListener('change',()=>saveLeaf(el.dataset.team,el.dataset.type,el.dataset.id,el.dataset.key,{completed:el.checked})));
 scope.querySelectorAll('.leaf-save').forEach(btn=>btn.addEventListener('click',()=>{
   const wrap=btn.closest('.leaf'),qty=wrap.querySelector('.leaf-qty-input'),chk=wrap.querySelector('.leaf-check-input'),note=wrap.querySelector('.leaf-note');
   saveLeaf(btn.dataset.team,btn.dataset.type,btn.dataset.id,btn.dataset.key,{completed:chk?chk.checked:undefined,progress_value:qty?Math.max(0,parseInt(qty.value||'0',10)):undefined,notes:note.value});
 }));
}
async function saveLeaf(team,type,id,keyName,patch){
 if(!codes[team])return;
 const old=rec(team,type,id,keyName),payload={team_slug:team,passcode:codes[team],item_type:type,item_id:id,requirement_id:keyName,completed:patch.completed??old.completed,progress_value:patch.progress_value??old.progress_value,notes:patch.notes??old.notes};
 try{const res=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await res.json();if(!res.ok)throw new Error(j.error||'Update failed');await loadState()}catch(e){alert(e.message)}
}
function renderInspector(){
 const kicker=document.getElementById('inspect-kicker'),title=document.getElementById('inspect-title'),body=document.getElementById('inspect-body'),status=document.getElementById('inspect-status');
 if(!selection){body.innerHTML='';status.textContent='';return}
 const team=TEAMS.find(t=>t.slug===selection.team);status.textContent=codes[team.slug]?'Editing enabled — update quantities, tick boxes, and save notes':'Read only — unlock this team to edit';
 if(selection.type==='node'){
  const n=nodes[selection.id];kicker.textContent=`${team.name} · ${n.group} · ${nodeStatus(team.slug,selection.id).toUpperCase()}`;title.textContent=`${selection.id} — ${n.name}`;
  body.innerHTML=`<div class="sections">${n.sections.map((s,i)=>`<div class="section ${nodeSectionDone(team.slug,selection.id,i)?'done':''}"><h3>${s.name} ${nodeSectionDone(team.slug,selection.id,i)?'<b>✓</b>':''}</h3>${renderTree(team.slug,'node',selection.id,s.tree)}</div>`).join('')}</div>`;
 }else if(selection.type==='trial'){
  const t=trials[selection.id],count=trialCount(team.slug,selection.id);kicker.textContent=`${team.name} · Trial ${selection.id} · ${trialStatus(team.slug,selection.id).toUpperCase()}`;title.textContent=t.name;
  body.innerHTML=`<div class="msg" style="margin-top:10px">Requires ${t.nodes.join(' + ')}. Complete any 3 of 5 objectives; 5/5 = Mastered. Current: ${count}/5.</div><div class="trial-grid">${t.objectives.map((o,i)=>`<div class="objective ${objectiveDone(team.slug,selection.id,i)?'done':''}"><h3>Objective ${i+1}${objectiveDone(team.slug,selection.id,i)?' ✓':''}</h3>${renderTree(team.slug,'trial',selection.id,o)}</div>`).join('')}</div>`;
 }else{
  kicker.textContent=`${team.name} · ${finalStatus(team.slug).toUpperCase()}`;title.textContent='The Final Seal';
  if(!finalUnlocked(team.slug)){const pn=['P','Q','R','S','T'].filter(n=>nodeDone(team.slug,n)).length,tc=Object.keys(trials).filter(t=>trialDone(team.slug,t)).length;body.innerHTML=`<div class="sections"><div class="section"><h3>Locked</h3><div class="msg">Final Seal challenge information is hidden until P/Q/R/S/T and five Trials are complete.</div></div><div class="section"><h3>Unlock progress</h3><div class="msg">P/Q/R/S/T: ${pn}/5<br>Trials: ${tc}/5</div></div></div>`}
  else{
   const won=finalChallengeCount(team.slug);let html=`<div class="msg" style="margin-top:10px"><b>Unlocked.</b> Complete any 3 challenges to win. Drops from before unlocking the Final Seal do not count.</div><div class="final-grid">`;
   for(const [slug,ch] of Object.entries(finalChallenges)){const cd=finalChallengeDone(team.slug,slug);let inner='';
    if(ch.special==='completionist'){const fn=Object.keys(nodes).filter(n=>nodeFull(team.slug,n)).length,mt=Object.keys(trials).filter(t=>trialMastered(team.slug,t)).length;inner=`<div class="msg">${fn}/25 fully levelled nodes · ${mt}/10 mastered Trials</div>`}
    else inner=ch.items.map((x,i)=>renderLeaf(team.slug,'final_seal',ch.name,{kind:'check',key:String(i),label:x})).join('');
    html+=`<div class="final-card ${cd?'done':''}"><h3>${ch.name}${cd?' ✓':''}</h3><div class="summary">${ch.rule}</div>${inner}</div>`;
   }
   html+=`</div>${won>=3?`<div class="win-banner">🏆 ${team.name} has completed 3 Final Seal challenges — BINGO WON</div>`:`<div class="msg" style="margin-top:12px">Final Seal challenges completed: ${won}/3 required.</div>`}`;body.innerHTML=html;
  }
 }
 bindEditors(body);
}
function openPass(team){modalTeam=team;document.getElementById('modal-title').textContent=`Unlock editing — ${TEAMS.find(t=>t.slug===team).name}`;document.getElementById('passcode').value='';document.getElementById('pass-msg').textContent='';document.getElementById('modalback').classList.add('open');document.getElementById('passcode').focus()}
document.getElementById('cancel-pass').onclick=()=>document.getElementById('modalback').classList.remove('open');
document.getElementById('save-pass').onclick=()=>{const v=document.getElementById('passcode').value.trim();if(!v){document.getElementById('pass-msg').textContent='Enter a passcode.';return}codes[modalTeam]=v;document.getElementById('modalback').classList.remove('open');renderTeams();renderInspector()};
document.getElementById('passcode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('save-pass').click()});
async function loadState(){try{const res=await fetch('/api/state',{cache:'no-store'});const j=await res.json();if(!res.ok)throw new Error(j.error||'Could not load state');state={};(j.rows||[]).forEach(r=>state[sk(r.team_slug,r.item_type,r.item_id,r.requirement_id)]=r);renderTeams();renderInspector()}catch(e){document.getElementById('inspect-status').textContent='Error loading live state: '+e.message}}
document.getElementById('refresh').onclick=loadState;setInterval(loadState,15000);loadState();
</script>
</body>
